[versions]
agp = "9.4.1"
junit = "4.13.2"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
googleServices = "4.5.0"
firebaseBom = "35.1.0"
robolectric = "4.17"
dotlottie = "0.16.0"
awebp = "3.0.5"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
# No versions: firebase-bom chooses them.
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# From jitpack (settings.gradle.kts).
dotlottie-android = { group = "com.github.LottieFiles", name = "dotlottie-android", version.ref = "dotlottie" }
# Plays the animated WebP files below API 28, where ImageDecoder is missing.
awebp = { group = "com.github.penfeizhou.android.animation", name = "awebp", version.ref = "awebp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

